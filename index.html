<script>
const photos = document.querySelectorAll(".photo");
const carousel = document.getElementById("carousel");

let current = 0;
let startX = 0;

function updatePhotos() {

    const total = photos.length;

    photos.forEach((photo, i) => {

        let position = i - current;

        if (position > total / 2)
            position -= total;

        if (position < -total / 2)
            position += total;

        const spacing = window.innerWidth <= 600 ? 125 : 170;

        const x = position * spacing;
        const y = Math.abs(position) * 20;

        let scale;

        if (position === 0) {
            scale = 1;
        } else if (Math.abs(position) === 1) {
            scale = 0.72;
        } else {
            scale = 0.5;
        }

        photo.style.transform =
            `translate(-50%, -50%) translateX(${x}px) translateY(${y}px) scale(${scale})`;

        photo.style.zIndex =
            100 - Math.abs(position);

        photo.style.opacity =
            Math.abs(position) > 2 ? 0 : 1;

    });
}


function nextPhoto() {
    current = (current + 1) % photos.length;
    updatePhotos();
}


// Previous
function previousPhoto() {
    current =
        (current - 1 + photos.length) %
        photos.length;

    updatePhotos();
}


let timer = setInterval(nextPhoto, 2000);


carousel.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
    clearInterval(timer);
});

carousel.addEventListener("touchend", e => {

    const endX = e.changedTouches[0].clientX;
    const distance = endX - startX;

    if (Math.abs(distance) > 50) {

        if (distance < 0)
            nextPhoto();
        else
            previousPhoto();

    }

    timer = setInterval(nextPhoto, 2000);
});


photos.forEach((photo, index) => {

    photo.addEventListener("click", () => {

        if (index !== current)
            return;

        const image = photo.querySelector("img");

        const fullscreen = document.createElement("div");

        fullscreen.className = "photo-fullscreen";

        fullscreen.innerHTML = `
            <span>×</span>
            <img src="${image.src}">
        `;

        document.body.appendChild(fullscreen);

        fullscreen.addEventListener("click", () => {
            fullscreen.remove();
        });

    });

});


updatePhotos();

window.addEventListener("load", () => {
    const skeleton = document.getElementById("skeleton-screen");

    setTimeout(() => {
        skeleton.style.opacity = "0";
        skeleton.style.transition = "opacity 0.4s ease";

        setTimeout(() => {
            skeleton.remove();
        }, 400);

    }, 500);
});

  const particles = document.getElementById("particles");

for (let i = 0; i < 40; i++) {
    const particle = document.createElement("div");

    particle.className = "particle";

    particle.style.left = Math.random() * 100 + "%";
    particle.style.animationDuration =
        (8 + Math.random() * 12) + "s";

    particle.style.animationDelay =
        Math.random() * 10 + "s";

    particle.style.opacity =
        0.2 + Math.random() * 0.5;

    particles.appendChild(particle);
}

async function shareCard() {
    const shareData = {
        title: "Yoco's Card",
        text: "Check out my Photo NFC Card! 📸",
        url: window.location.href
    };

    try {
        if (navigator.share) {
            await navigator.share(shareData);
        } else {
            await navigator.clipboard.writeText(window.location.href);
            alert("Link copied!");
        }
    } catch (error) {
        console.log("Sharing cancelled.");
    }
}
  
</script>
